<style>
:root{--c:#15577d;--c2:#1a6b96;--bg:#eef2f5;--line:#cdd8e0;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;}
body{background:var(--bg);color:#1a2b22;font-size:14px;}
header{background:var(--c);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{font-size:18px;} .chip{font-size:11px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:10px;margin-inline-start:6px;}
.tabs{display:flex;gap:4px;background:var(--c2);padding:0 12px;flex-wrap:wrap;}
.tabs button{background:none;border:none;color:#dbe8df;padding:12px 18px;cursor:pointer;font-size:15px;font-weight:600;border-bottom:3px solid transparent;}
.tabs button.active{color:#fff;border-bottom-color:#FCD51D;}
.wrap{padding:18px;max-width:1400px;margin:0 auto;}
.btn{background:var(--c2);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;}
.btn:hover{background:var(--c);}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
.toolbar input[type=text]{min-width:240px;} .count{color:#556;font-size:13px;margin-inline-start:auto;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
th{background:var(--c2);color:#fff;padding:11px 10px;font-size:13px;}
td{padding:8px 10px;border-bottom:1px solid #eef2ef;}
html[dir=rtl] th,html[dir=rtl] td{text-align:right;} html[dir=ltr] th,html[dir=ltr] td{text-align:left;}
tr:hover td{background:#f7fbf8;}
td select{width:100%;border:1px solid transparent;background:transparent;padding:5px;border-radius:5px;font-size:13px;cursor:pointer;}
td select:hover{border-color:var(--line);background:#fff;}
.hinp{width:104px;border:1px solid transparent;border-radius:5px;padding:4px 6px;font-size:13px;background:transparent;font-family:inherit;color:inherit;}
.hinp:hover,.hinp:focus{border-color:var(--line);background:#fff;outline:none;}
body.viewonly .hinp{pointer-events:none;border-color:transparent;background:transparent;}
body.viewonly td select{pointer-events:none;-webkit-appearance:none;appearance:none;border:none;background:transparent;font-weight:600;}
body.viewonly .edit-only{display:none!important;}
.admin-only{display:none!important;}
body.isadmin .admin-only{display:inline-block!important;}
body.isadmin .tabs .admin-only{display:inline-block!important;}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin:16px 0;}
.pager button{padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;} .pager button:disabled{opacity:.4;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-inline-start:5px solid var(--c2);}
.card .lbl{color:#667;font-size:13px;margin-bottom:6px;} .card .val{font-size:28px;font-weight:800;color:var(--c);}
.card.term{border-inline-start-color:#c0392b;} .card.term .val{color:#c0392b;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;} @media(max-width:800px){.grid2{grid-template-columns:1fr;}}
.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.panel h3{color:var(--c);margin-bottom:12px;font-size:16px;border-bottom:2px solid var(--line);padding-bottom:8px;}
.login{position:fixed;inset:0;background:var(--c);display:flex;align-items:center;justify-content:center;z-index:1000;}
.loginbox{background:#fff;border-radius:16px;padding:34px;max-width:400px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.loginbox h2{color:var(--c);margin-bottom:6px;text-align:center;} .loginbox p{color:#667;margin-bottom:18px;text-align:center;font-size:13px;}
.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font-size:15px;}
.loginbox .primary{width:100%;padding:13px;background:var(--c);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;}
.loginbox .link{text-align:center;margin-top:14px;font-size:13px;color:var(--c2);cursor:pointer;text-decoration:underline;}
.langtoggle{text-align:center;margin-bottom:16px;}
.langtoggle button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--c);font-weight:700;}
.err{color:#c0392b;font-size:13px;margin-top:8px;text-align:center;min-height:18px;}
.ok{color:#0b8043;font-size:13px;margin-top:8px;text-align:center;min-height:18px;}
.loading{text-align:center;padding:40px;color:#667;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;}
.modal{background:#fff;border-radius:14px;max-width:820px;width:94%;max-height:88vh;overflow:auto;}
.modal .mh{background:var(--c);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;}
.mclose{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;}
.mb{padding:20px;} .assignbox{background:#f0f7f2;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:16px;}
.assignbox .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;} .assignbox input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;}
.dbtn{background:#eef4f0;color:var(--c);border:1px solid var(--line);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;}
.dbtn:hover{background:var(--c2);color:#fff;} .curbadge{background:#FFF6D5;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;background:#eee;}
.tag{padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.tag.pending{background:#fde9c8;color:#8a5a00;} .tag.approved{background:#d6f5df;color:#0b6b34;}
</style></head>

<div class="login" id="login"><div class="loginbox">

  <button class="primary" onclick="logout()" style="margin-top:16px" data-i18n="logout">Logout</button>
</div></div>

<header>
  <h1>🏍️ DTC Fleet System <span class="chip" id="userChip"></span></h1>
  <div style="display:flex;gap:8px">
    <button class="btn" onclick="switchLang()" id="langBtn" style="background:#0a3d5c">ع</button>
    <button class="btn admin-only" onclick="document.getElementById('impDrv').click()"><span data-i18n="imp_drv">Import Drivers</span></button>
    <button class="btn admin-only" onclick="document.getElementById('syncDrv').click()" style="background:#0a3d5c"><span data-i18n="sync_drv">Sync JDE</span></button>
    <button class="btn admin-only" onclick="document.getElementById('impBk').click()"><span data-i18n="imp_bk">Import Bikes</span></button>
    <button class="btn admin-only" onclick="backup()" style="background:#0a3d5c"><span data-i18n="backup">Backup</span></button>
    <button class="btn" onclick="loadAll()"><span data-i18n="refresh">Refresh</span></button>
    <input type="file" id="impDrv" accept=".xlsx,.xls,.csv" style="display:none" onchange="importList(this,'drivers')">
    <input type="file" id="syncDrv" accept=".xlsx,.xls,.csv" style="display:none" onchange="importList(this,'drivers',true)">
    <input type="file" id="impBk" accept=".xlsx,.xls,.csv" style="display:none" onchange="importList(this,'bikes')">
    <button class="btn" onclick="logout()" style="background:#c0392b"><span data-i18n="logout">Logout</span></button>
  </div>
</header>
<div class="tabs" id="tabs">
  <button class="active" onclick="tab('dash',this)" data-i18n="t_dash">Dashboard</button>
  <button onclick="tab('drivers',this)" data-i18n="t_drivers">Drivers</button>
  <button onclick="tab('bikes',this)" data-i18n="t_bikes">Bikes</button>
  <button class="admin-only" onclick="tab('audit',this)" data-i18n="t_audit">Audit Log</button>
  <button onclick="tab('users',this)" id="usersTab" data-i18n="t_users" style="display:none">Users</button>
</div>
<div class="wrap">
  <div id="dash"><div class="loading">...</div></div>
  <div id="drivers" style="display:none"></div><div id="bikes" style="display:none"></div>
  <div id="audit" style="display:none"></div><div id="users" style="display:none"></div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

let LANG="en",ROLE="viewer",USER="",REG=false,DB={drivers:[],bikes:[]};
function L(k){return (T[LANG]&&T[LANG][k])||k;}
function applyLang(){document.documentElement.dir=(LANG==="ar")?"rtl":"ltr";document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=L(e.getAttribute("data-i18n")));
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=L(e.getAttribute("data-i18n-ph")));
  var b=document.getElementById("langBtn");if(b)b.textContent=(LANG==="ar")?"EN":"ع";
  if(document.getElementById("login").style.display!=="none"){var rl=document.getElementById("regLink");rl.textContent=REG?L("have_acct"):L("need_acct");var lb=document.querySelector(".loginbox .primary");if(lb)lb.textContent=REG?L("register_btn"):L("login_btn");}
  renderDash();refreshView();}
function switchLang(){LANG=(LANG==="ar")?"en":"ar";applyLang();}
function toggleReg(){REG=!REG;document.getElementById("regLink").textContent=REG?L("have_acct"):L("need_acct");document.querySelector(".loginbox .primary").textContent=REG?L("register_btn"):L("login_btn");document.querySelector(".loginbox .primary").setAttribute("onclick",REG?"doRegister()":"doLogin()");document.getElementById("loginErr").textContent="";document.getElementById("loginOk").textContent="";}

async function doLogin(){const em=document.getElementById("email").value.trim(),pw=document.getElementById("pw").value;
  document.getElementById("loginErr").textContent="...";
  const {error}=await SB.auth.signInWithPassword({email:em,password:pw});
  if(error){document.getElementById("loginErr").textContent="❌ "+error.message;return;}
  document.getElementById("loginErr").textContent="";await afterLogin();}
async function doRegister(){const em=document.getElementById("email").value.trim(),pw=document.getElementById("pw").value;
  document.getElementById("loginErr").textContent="...";document.getElementById("loginOk").textContent="";
  const {data,error}=await SB.auth.signUp({email:em,password:pw});
  if(error){document.getElementById("loginErr").textContent="❌ "+(error.message||L("reg_err"));return;}
  if(data&&data.user&&data.user.identities&&data.user.identities.length===0){document.getElementById("loginErr").textContent="❌ "+L("reg_dup");return;}
  if(data&&data.user){const {error:ie}=await SB.from("app_users").insert({auth_id:data.user.id,full_name:em,role:"viewer",status:"pending"});if(ie&&ie.code!=="23505"){document.getElementById("loginErr").textContent="❌ "+ie.message;return;}}
  await SB.auth.signOut();
  document.getElementById("loginErr").textContent="";document.getElementById("loginOk").textContent="✅ "+L("reg_ok");}
async function afterLogin(){const {data:{user}}=await SB.auth.getUser();if(!user)return;USER=user.email;
  const {data:r}=await SB.rpc("my_role");ROLE=r||"viewer";
  let status=null;
  try{const {data:st}=await SB.rpc("my_status");if(st!==null&&st!==undefined)status=st;}catch(e){}
  if(status!=="approved"&&ROLE!=="admin"){document.getElementById("login").style.display="none";document.getElementById("pending").style.display="flex";return;}
  document.getElementById("userChip").textContent=USER+" ("+ROLE+")";
  if(ROLE==="viewer")document.body.classList.add("viewonly");else document.body.classList.remove("viewonly");
  if(ROLE==="admin"){document.getElementById("usersTab").style.display="";document.body.classList.add("isadmin");}else{document.body.classList.remove("isadmin");}
  document.getElementById("login").style.display="none";document.getElementById("pending").style.display="none";
  await loadAll();}
async function logout(){await SB.auth.signOut();location.reload();}

async function loadAll(){document.getElementById("dash").innerHTML='<div class="loading">...</div>';
  let bikes=[],from=0;while(true){const {data}=await SB.from("bikes").select("*").range(from,from+999);if(!data||!data.length)break;bikes=bikes.concat(data);if(data.length<1000)break;from+=1000;}
  let drv=[],f2=0;while(true){const {data}=await SB.from("drivers").select("*").range(f2,f2+999);if(!data||!data.length)break;drv=drv.concat(data);if(data.length<1000)break;f2+=1000;}
  DB.bikes=bikes;DB.drivers=drv;renderDash();refreshView();}
function tab(id,btn){["dash","drivers","bikes","audit","users"].forEach(t=>document.getElementById(t).style.display=t===id?"block":"none");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
  if(id==="dash")renderDash();if(id==="drivers")renderDrivers();if(id==="bikes")renderBikes();if(id==="audit")renderAudit();if(id==="users")renderUsers();}
function refreshView(){const a=document.querySelector(".tabs button.active");if(!a)return;const id=["dash","drivers","bikes","audit","users"].find(x=>document.getElementById(x).style.display!=="none");
  if(id==="drivers")renderDrivers();else if(id==="bikes")renderBikes();else if(id==="audit")renderAudit();else if(id==="users")renderUsers();}

function renderDash(){const D=DB.drivers,B=DB.bikes;if(!D.length&&!B.length)return;
  const ended=D.filter(d=>d.classification==="Ended Service"||d.classification==="Resigned").length,total=D.length-ended,working=D.filter(d=>d.classification==="Working"||d.classification==="New Rider").length;
  const cc={};D.forEach(d=>cc[d.classification]=(cc[d.classification]||0)+1);const bc={};B.forEach(b=>bc[b.status]=(bc[b.status]||0)+1);
  const disp=B.filter(b=>String(b.status).includes("Disposed")).length;
  let h=`<div class="cards">
    <div class="card"><div class="lbl">${L("active")}</div><div class="val">${total}</div></div>
    <div class="card"><div class="lbl">${L("working")}</div><div class="val">${working}</div></div>
    <div class="card term"><div class="lbl">${L("term")}</div><div class="val">${ended}</div></div>
    <div class="card"><div class="lbl">${L("bikesx")}</div><div class="val">${B.length-disp}</div></div>
    <div class="card"><div class="lbl">${L("wr")}</div><div class="val">${bc["With Rider"]||0}</div></div></div><div class="grid2">`;
  h+=`<div class="panel"><h3>${L("cls_t")}</h3><table><tr><th>${L("clsh")}</th><th>${L("cnt")}</th></tr>`;
  CLS.forEach(c=>{if(c==="New Rider")return;let n=cc[c]||0,lbl=c;if(c==="Working"){n+=cc["New Rider"]||0;lbl="Working + New Rider";}if(n)h+=`<tr><td><span class="badge" style="background:${CLR[c]||"#eee"}">${lbl}</span></td><td>${n}</td></tr>`;});
  h+=`</table></div><div class="panel"><h3>${L("bst_t")}</h3><table><tr><th>${L("sts")}</th><th>${L("cnt")}</th></tr>`;
  BST.forEach(s=>{if(bc[s])h+=`<tr><td><span class="badge" style="background:${CLR[s]||"#eee"}">${s}</span></td><td>${bc[s]}</td></tr>`;});
  h+=`</table></div></div>`;document.getElementById("dash").innerHTML=h;}

let dP=0,dF="",dCls="",dComp="",dRecvFrom="",dRecvTo="";
function pdmy(s){if(!s)return null;s=String(s).trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d;}
function renderDrivers(){document.getElementById("drivers").innerHTML=`<div class="toolbar"><input type="text" placeholder="${L("search")}" value="${dF}" oninput="dF=this.value;dP=0;drawD()">
  <select onchange="dComp=this.value;dP=0;drawD()"><option value="">${L("allc")}</option>${COMP.map(c=>`<option ${dComp===c?"selected":""}>${c}</option>`).join("")}</select>
  <select onchange="dCls=this.value;dP=0;drawD()"><option value="">${L("allcls")}</option>${CLS.map(c=>`<option ${dCls===c?"selected":""}>${c}</option>`).join("")}</select>
  <label style="font-size:12px;color:#556">${L("recv_from")} <input type="date" value="${dRecvFrom}" onchange="dRecvFrom=this.value" style="padding:7px;border:1px solid var(--line);border-radius:6px"></label>
  <label style="font-size:12px;color:#556">${L("recv_to")} <input type="date" value="${dRecvTo}" onchange="dRecvTo=this.value" style="padding:7px;border:1px solid var(--line);border-radius:6px"></label>
  <button class="btn" style="background:#0b8043" onclick="exportDrivers()">⬇ ${L("export")}</button><span class="count" id="dc"></span></div><div id="dt"></div><div class="pager" id="dpg"></div>`;drawD();}
async function exportDrivers(){const list=fD();const ids=[...new Set(list.map(d=>d.driver_id))];const recMap={};
  for(let k=0;k<ids.length;k+=300){const {data}=await SB.from("bike_history").select("driver_id,motor_id,received_date").in("driver_id",ids.slice(k,k+300));(data||[]).forEach(h=>{recMap[h.driver_id+"|"+h.motor_id]=h.received_date;});}
  const fromD=dRecvFrom?new Date(dRecvFrom):null,toD=dRecvTo?new Date(dRecvTo+"T23:59:59"):null;
  const rows=list.map(d=>({d,rv:(d.cur_motor?recMap[d.driver_id+"|"+d.cur_motor]:"")||""}))
    .filter(x=>{if(!fromD&&!toD)return true;const dt=pdmy(x.rv);if(!dt)return false;if(fromD&&dt<fromD)return false;if(toD&&dt>toD)return false;return true;})
    .map(x=>({"DTC ID":x.d.driver_id,Name:x.d.name||"",Company:canonCo(x.d.company)||"",Bike:x.d.cur_motor||"",Plate:x.d.cur_plate||"",Classification:x.d.classification||"","Bike Received":x.rv}));
  if(!rows.length){alert(L("no_rows"));return;}
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Drivers");XLSX.writeFile(wb,"DTC_Drivers"+(dComp?"_"+dComp:"")+(dCls?"_"+dCls.replace(/[^\w]/g,""):"")+".xlsx");}
function fD(){const f=dF.trim().toLowerCase();return DB.drivers.filter(d=>(!f||String(d.driver_id).includes(f)||(d.name||"").toLowerCase().includes(f))&&(!dCls||d.classification===dCls)&&(!dComp||canonCo(d.company)===dComp));}
function drawD(){const rows=fD(),per=50,pg=Math.ceil(rows.length/per)||1;if(dP>=pg)dP=0;const sl=rows.slice(dP*per,dP*per+per);
  document.getElementById("dc").textContent=rows.length+" "+L("ndrv");
  let h=`<table><tr><th>${L("c_id")}</th><th>${L("c_name")}</th><th>${L("c_company")}</th><th>${L("c_bike")}</th><th>${L("c_cls")}</th><th></th></tr>`;
  sl.forEach(d=>{h+=`<tr><td>${d.driver_id}</td><td>${d.name||""}</td>
    <td><select onchange="upD(${d.driver_id},'company',this.value)">${COMP.map(c=>`<option ${canonCo(d.company)===c?"selected":""}>${c}</option>`).join("")}${!COMP.includes(canonCo(d.company))&&d.company?`<option selected>${canonCo(d.company)}</option>`:""}</select></td>
    <td>${d.cur_motor||"—"}</td>
    <td><select onchange="upD(${d.driver_id},'classification',this.value)">${CLS.map(c=>`<option ${d.classification===c?"selected":""}>${c}</option>`).join("")}</select></td>
    <td><button class="dbtn" onclick="openDetail(${d.driver_id})">📋 ${L("details")}</button></td></tr>`;});
  h+=`</table>`;document.getElementById("dt").innerHTML=h;
  document.getElementById("dpg").innerHTML=pg>1?`<button onclick="dP--;drawD()" ${dP===0?"disabled":""}>◄</button><span>${dP+1}/${pg}</span><button onclick="dP++;drawD()" ${dP>=pg-1?"disabled":""}>►</button>`:"";}
async function upD(id,field,val){const d=DB.drivers.find(x=>x.driver_id===id);if(d)d[field]=val;
  const {error}=await SB.from("drivers").update({[field]:val,updated_by:USER,updated_at:new Date().toISOString()}).eq("driver_id",id);if(error)alert("❌ "+error.message);}

async function upB(id,field,val){const b=DB.bikes.find(x=>x.motor_id===id);const now=new Date().toISOString();if(b){b[field]=val;b.updated_at=now;}
  const {error}=await SB.from("bikes").update({[field]:val,updated_by:USER,updated_at:now}).eq("motor_id",id);if(error){alert("❌ "+error.message);return;}
  if(field==="status"&&b&&b.driver_id){await SB.from("bike_history").update({status:val,last_updated:new Date().toLocaleDateString("en-GB")}).eq("motor_id",id).eq("driver_id",b.driver_id);}
  drawB();}

let AUD=[],AUDUSERS=[],audUser="",audDate="";
async function renderAudit(){document.getElementById("audit").innerHTML='<div class="loading">...</div>';
  if(!AUDUSERS.length){const u=await SB.from("app_users").select("full_name");AUDUSERS=[...new Set([...(u.data||[]).map(x=>x.full_name).filter(Boolean),"النظام"])].sort();}
  let q=SB.from("audit_log").select("*").order("ts",{ascending:false});
  if(audUser)q=q.eq("user_name",audUser);
  if(audDate){q=q.gte("ts",audDate+"T00:00:00").lte("ts",audDate+"T23:59:59.999").limit(5000);}else{q=q.limit(200);}
  const {data}=await q;AUD=data||[];
  const adm=document.body.classList.contains("isadmin");const PKM={drivers:"driver_id",bikes:"motor_id",bike_history:"id",app_users:"id"};
  let h=`<div class="toolbar"><select onchange="audUser=this.value;renderAudit()"><option value="">${L("all_users")}</option>${AUDUSERS.map(u=>`<option ${audUser===u?"selected":""}>${u}</option>`).join("")}</select>`+
    `<input type="date" value="${audDate}" onchange="audDate=this.value;renderAudit()">`+
    `<button class="btn" onclick="audDate='${new Date().toISOString().slice(0,10)}';renderAudit()">${L("today")}</button>`+
    `<button class="btn" onclick="audDate='';audUser='';renderAudit()">${L("clear")}</button>`+
    `<button class="btn" style="background:#0b8043" onclick="exportAudit()">⬇ ${L("export")}</button>`+
    (adm?`<button class="btn" style="background:#c0392b" onclick="revertSelected()">↩ ${L("revert_sel")}</button>`:"")+
    `<span class="count">${AUD.length} ${L("changes")}</span></div>`;
  h+=`<table><tr>${adm?`<th><input type="checkbox" onchange="audToggleAll(this.checked)"></th>`:""}<th>${L("when")}</th><th>${L("who")}</th><th>${L("what")}</th><th>${L("tbl")}</th><th>${L("c_id")}</th><th>${L("fld")}</th><th>${L("oldv")}</th><th>${L("newv")}</th>${adm?`<th>${L("revert")}</th>`:""}</tr>`;
  AUD.forEach((r,i)=>{const rv=adm&&r.action==="UPDATE"&&r.field_changed&&PKM[r.table_name];
    h+=`<tr>${adm?`<td>${rv?`<input type="checkbox" class="audck" data-i="${i}">`:""}</td>`:""}<td>${new Date(r.ts).toLocaleString("en-GB")}</td><td>${r.user_name||"—"}</td><td>${r.action}</td><td>${r.table_name}</td><td>${r.record_id||"—"}</td><td>${r.field_changed||"—"}</td><td>${r.old_value||"—"}</td><td style="font-weight:600;color:#0b8043">${r.new_value||"—"}</td>${adm?`<td>${rv?`<button class="dbtn" onclick="revertAudit(${i})">↩ ${L("revert")}</button>`:"—"}</td>`:""}</tr>`;});
  h+=`</table>`;document.getElementById("audit").innerHTML=h;}
function exportAudit(){const rows=AUD.map(r=>({When:new Date(r.ts).toLocaleString("en-GB"),User:r.user_name||"",Action:r.action,Table:r.table_name,ID:r.record_id||"",Field:r.field_changed||"",Old:r.old_value||"",New:r.new_value||""}));
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Audit");XLSX.writeFile(wb,"DTC_Audit_"+(audDate||"all")+(audUser?"_"+audUser.split("@")[0]:"")+".xlsx");}
function audToggleAll(ch){document.querySelectorAll(".audck").forEach(c=>c.checked=ch);}
async function doRevert(r){const PK={drivers:"driver_id",bikes:"motor_id",bike_history:"id",app_users:"id"}[r.table_name];
  if(!PK||r.action!=="UPDATE"||!r.field_changed)return false;
  const {error}=await SB.from(r.table_name).update({[r.field_changed]:r.old_value}).eq(PK,r.record_id);return !error;}
async function revertSelected(){const idx=[...document.querySelectorAll(".audck:checked")].map(c=>+c.dataset.i);
  if(!idx.length){alert(L("revert_none"));return;}
  if(!confirm(L("revert_selc").replace("%n",idx.length)))return;
  let ok=0;for(const i of idx){if(await doRevert(AUD[i]))ok++;}
  await loadAll();alert("✅ "+ok+" "+L("revert_done"));}
async function revertAudit(i){const r=AUD[i];if(!r)return;
  if(r.action!=="UPDATE"||!r.field_changed){alert(L("revert_no"));return;}
  if(!confirm(L("revert_c").replace("%f",r.field_changed).replace("%v",r.old_value==null?"—":r.old_value)))return;
  if(!await doRevert(r)){alert("❌ "+L("revert_no"));return;}
  await loadAll();alert("✅ "+L("revert_done"));}
async function OLD_revertAudit(i){const r=AUD[i];if(!r)return;const PK={drivers:"driver_id",bikes:"motor_id",bike_history:"id",app_users:"id"}[r.table_name];
  if(!PK||r.action!=="UPDATE"||!r.field_changed){alert(L("revert_no"));return;}
  if(!confirm(L("revert_c").replace("%f",r.field_changed).replace("%v",r.old_value==null?"—":r.old_value)))return;
  const {error}=await SB.from(r.table_name).update({[r.field_changed]:r.old_value}).eq(PK,r.record_id);
  if(error){alert("❌ "+error.message);return;}
  await loadAll();alert("✅ "+L("revert_done"));}

async function importList(input,kind,sync){const file=input.files[0];if(!file){return;}
  const rd=new FileReader();
  rd.onload=async function(e){try{
    const wb=XLSX.read(e.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:""});if(!rows.length){alert("Empty");return;}
    const hdr=Object.keys(rows[0]).reduce((a,k)=>{a[k.toLowerCase().trim()]=k;return a;},{});
    function col(row,names){for(const n of names){if(hdr[n]!==undefined)return row[hdr[n]];}return "";}
    function has(names){for(const n of names){if(hdr[n]!==undefined)return true;}return false;}
    let recs=[];const fileIds=new Set();
    if(kind==="drivers"){
      for(const r of rows){const id=String(col(r,["dtc id","driver id","id","driver_id"])).trim().replace(/\.0$/,"");if(!id||isNaN(id))continue;
        const rec={driver_id:parseInt(id),updated_by:USER,updated_at:new Date().toISOString()};fileIds.add(parseInt(id));
        if(has(["name","الاسم"]))rec.name=col(r,["name","الاسم"])||null;
        if(has(["company","contract name","الشركة"]))rec.company=canonCo(col(r,["company","contract name","الشركة"]))||null;
        if(has(["classification","status","التصنيف"]))rec.classification=col(r,["classification","status","التصنيف"])||"Unspecified";
        if(has(["jde","jde status"]))rec.jde_status=col(r,["jde","jde status"])||"Active";
        recs.push(rec);}
    }else{
      for(const r of rows){const m=String(col(r,["motor-id","motor id","motor_id","unit","unit number","الدراجة"])).trim().toUpperCase().replace(/\s+/g,"");if(!m)continue;
        recs.push({motor_id:m,plate:String(col(r,["plate","plate no","اللوحة"])||"")||null,status:col(r,["status","الحالة"])||"Parked at DTC - Usable",
          company:col(r,["company","الشركة"])||null,updated_by:USER,updated_at:new Date().toISOString()});}
    }
    if(!recs.length){alert(L("imp_err"));return;}
    let ok=0;for(let i=0;i<recs.length;i+=500){const {error}=await SB.from(kind).upsert(recs.slice(i,i+500),{onConflict:kind==="drivers"?"driver_id":"motor_id"});if(error){alert("❌ "+error.message);return;}ok+=recs.slice(i,i+500).length;}
    alert("✅ "+ok+" "+L("imp_done"));
    if(sync&&kind==="drivers"){const others=DB.drivers.filter(d=>!fileIds.has(d.driver_id)&&d.classification!=="Ended Service"&&d.classification!=="Resigned").map(d=>d.driver_id);
      if(others.length&&confirm(L("sync_confirm").replace("%n",others.length))){let e2=0;
        for(let i=0;i<others.length;i+=400){const {error}=await SB.from("drivers").update({classification:"Ended Service",updated_by:USER,updated_at:new Date().toISOString()}).in("driver_id",others.slice(i,i+400));if(error){e2++;}}
        alert(e2?("⚠️ "+e2+" batch error"):("✅ "+others.length+" "+L("sync_done")));}}
    await loadAll();
  }catch(err){alert("❌ "+err.message);}};
  rd.readAsArrayBuffer(file);input.value="";}

function backup(){const wb=XLSX.utils.book_new();

  document.getElementById("overlay").style.display="flex";

  h+=`<h3 style="color:var(--c);margin-bottom:10px">🏍️ ${L("hist_t")} (${(hist||[]).length})</h3>`;
  if(hist&&hist.length){h+=`<table><tr><th>#</th><th>${L("c_motor")}</th><th>${L("c_plate")}</th><th>${L("recv")}</th><th>${L("sts")}</th><th>${L("lastup")}</th></tr>`;
    hist.forEach((b,n)=>{const cur=b.motor_id===d.cur_motor;
      const stc=cur?`<select class="edit-only" onchange="editCurStatus(${id},'${b.motor_id}',this.value)">${BST.map(s=>`<option ${curSt===s?"selected":""}>${s}</option>`).join("")}</select>`:(b.status||"—");
      h+=`<tr ${cur?'class="curbadge"':''}><td>${cur?L("cur"):L("bikeN")+" "+(n+1)}</td><td><b>${b.motor_id}</b></td><td>${b.plate||"—"}</td><td><input class="hinp" value="${b.received_date||''}" placeholder="DD/MM/YYYY" onchange="upHist(${b.id},'received_date',this.value)"></td><td>${cur?stc:(b.status||"—")}</td><td><input class="hinp" style="font-weight:600;color:#0b8043" value="${b.last_updated||''}" placeholder="DD/MM/YYYY" onchange="upHist(${b.id},'last_updated',this.value)"></td></tr>`;});
    h+=`</table><p style="font-size:12px;color:#778;margin-top:8px" class="edit-only">💡 ${L("edit_hint2")}</p>`;}else{h+=`<p style="color:#889">—</p>`;}
  h+=`<div class="assignbox edit-only"><h4 style="color:var(--c);margin-bottom:10px">➕ ${L("assign_t")}</h4><div class="row">
    <input type="text" id="am" placeholder="${L("c_motor")} (DLB123)"><input type="text" id="ap" placeholder="${L("c_plate")}">
    <button class="btn" onclick="assignBike(${id})">${L("assign_b")}</button></div></div></div>`;
  document.getElementById("modal").innerHTML=h;}
function closeModal(){document.getElementById("overlay").style.display="none";}
async function upHist(hid,field,val){val=val.trim();
  if(val&&!/^\d{2}\/\d{2}\/\d{4}$/.test(val)){alert("❌ "+L("bad_date"));return;}
  if(val){const p=val.split("/"),dd=+p[0],mm=+p[1];if(dd<1||dd>31||mm<1||mm>12){alert("❌ "+L("bad_date"));return;}}
  const {error}=await SB.from("bike_history").update({[field]:val}).eq("id",hid);if(error)alert("❌ "+error.message);}

async function editCurStatus(id,motor,val){const d=DB.drivers.find(x=>x.driver_id===id);const today=new Date().toLocaleDateString("en-GB");
  await SB.from("bikes").update({status:val,updated_by:USER,updated_at:new Date().toISOString()}).eq("motor_id",motor);
  await SB.from("bike_history").update({status:val,last_updated:today}).eq("driver_id",id).eq("motor_id",motor);
  const bk=DB.bikes.find(b=>b.motor_id===motor);if(bk)bk.status=val;
  if(val!=="With Rider"){await SB.from("bikes").update({driver_id:null}).eq("motor_id",motor);
    await SB.from("drivers").update({cur_motor:null,cur_plate:null,updated_by:USER,updated_at:new Date().toISOString()}).eq("driver_id",id);
    if(bk)bk.driver_id=null;d.cur_motor=null;d.cur_plate=null;}
  openDetail(id);drawD();}

async function assignBike(id){const d=DB.drivers.find(x=>x.driver_id===id);const m=document.getElementById("am").value.trim().toUpperCase();const p=document.getElementById("ap").value.trim();
  if(!m){alert(L("c_motor")+"?");return;}const today=new Date().toLocaleDateString("en-GB");
  const tbk=DB.bikes.find(b=>b.motor_id===m);
  if(tbk&&tbk.driver_id&&String(tbk.driver_id)!==String(id)){
    const cur=DB.drivers.find(x=>String(x.driver_id)===String(tbk.driver_id));const NL=String.fromCharCode(10);
    const info=cur?(tbk.driver_id+" — "+(cur.name||"")):("ID "+tbk.driver_id);
    if(!confirm(L("warn_a").replace("%m",m)+NL+info+NL+NL+L("confirm_a")))return;
    if(cur){await SB.from("drivers").update({cur_motor:null,cur_plate:null}).eq("driver_id",cur.driver_id);cur.cur_motor=null;}}
  await SB.from("drivers").update({cur_motor:m,cur_plate:p,classification:d.classification==="Working"?"Working":"Working",updated_by:USER,updated_at:new Date().toISOString()}).eq("driver_id",id);
  await SB.from("bikes").update({driver_id:id,status:"With Rider",updated_by:USER,updated_at:new Date().toISOString()}).eq("motor_id",m);
  const {data:ex}=await SB.from("bike_history").select("id").eq("driver_id",id).eq("motor_id",m).maybeSingle();
  if(ex)await SB.from("bike_history").update({plate:p,status:"With Rider",received_date:today,last_updated:today}).eq("id",ex.id);
  else await SB.from("bike_history").insert({driver_id:id,motor_id:m,plate:p,received_date:today,status:"With Rider",last_updated:today});
  d.cur_motor=m;d.cur_plate=p;d.classification="Working";const bk=DB.bikes.find(b=>b.motor_id===m);if(bk){bk.driver_id=id;bk.status="With Rider";}
  openDetail(id);drawD();alert("✅ "+m);}

(async()=>{const {data:{session}}=await SB.auth.getSession();if(session)await afterLogin();applyLang();})();
</script></body></html>
